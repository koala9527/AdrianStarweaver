<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Shadow -->
  <ellipse cx="20" cy="38" rx="12" ry="2.5" fill="#00000033"/>
  <!-- Dark aura -->
  <circle cx="20" cy="20" r="18" fill="#330044" opacity="0.15"/>
  <circle cx="20" cy="20" r="14" fill="#440066" opacity="0.1"/>
