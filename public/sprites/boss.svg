  <path d="M20,8 L26,16 L25,28 L15,28 L14,16 Z" fill="#8844cc" opacity="0.4"/>
  <!-- Eye - single menacing eye -->
  <ellipse cx="20" cy="17" rx="5" ry="4" fill="#110022"/>
  <ellipse cx="20" cy="17" rx="3.5" ry="2.8" fill="#ff2266"/>
  <ellipse cx="20" cy="17" rx="2" ry="1.8" fill="#ff66aa"/>
  <circle cx="20" cy="16.5" r="1" fill="#ffffff" opacity="0.7"/>
  <!-- Cracks with purple glow -->
  <path d="M14,12 L17,16 L13,22" stroke="#aa44ff" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M26,10 L23,15 L27,20" stroke="#aa44ff" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M18,26 L20,30 L22,26" stroke="#aa44ff" stroke-width="0.6" fill="none" opacity="0.5"/>
  <!-- Floating vine tendrils -->
  <path d="M8,14 Q5,10 7,6" stroke="#8833aa" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M32,14 Q35,10 33,6" stroke="#8833aa" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M6,22 Q3,20 4,16" stroke="#7722aa" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M34,22 Q37,20 36,16" stroke="#7722aa" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- Energy particles -->
  <circle cx="8" cy="8" r="1.5" fill="#aa44ff" opacity="0.5"/>
  <circle cx="33" cy="7" r="1.2" fill="#cc66ff" opacity="0.4"/>
  <circle cx="6" cy="26" r="1" fill="#8833cc" opacity="0.4"/>
  <circle cx="35" cy="25" r="1.3" fill="#9944dd" opacity="0.35"/>
  <!-- Crown spikes -->
  <path d="M15,6 L16,2 L18,5" fill="#7733bb" opacity="0.7"/>
  <path d="M22,5 L24,2 L25,6" fill="#7733bb" opacity="0.7"/>
